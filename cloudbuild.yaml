# ============================================================
# Smart Kitchen Replenishment System — Google Cloud Build Config
# ============================================================
# This file automates deployment to Google Cloud Run
# Every push to the main branch will trigger an automatic deployment
# ============================================================

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/smart-kitchen-api'
      - '-t'
      - 'gcr.io/$PROJECT_ID/smart-kitchen-api:$SHORT_SHA'
      - '.'

  # Step 2: Push the Docker image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/smart-kitchen-api'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'smart-kitchen-api'
      - '--image=gcr.io/$PROJECT_ID/smart-kitchen-api:$SHORT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8000'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=1'
      - '--max-instances=10'
      - '--set-env-vars=DATABASE_URL=postgresql+asyncpg://postgres:Chinmay2005%@db.eqjianefzeaighbjegye.supabase.co:6543/postgres?ssl=require,SUPABASE_URL=https://eqjianefzeaighbjegye.supabase.co,SECRET_KEY=d85669c6c3e74554476c5ec4d4407ae9cba3b963e8e8d138ea59c22abdbc2e7c,SERVER_TOKEN=smart_kitchen_server_token_2024,ENABLE_SIMULATION=false,EVALUATION_INTERVAL_SECONDS=30,TELEMETRY_INTERVAL_SECONDS=10

# Store images in Google Container Registry
images:
  - 'gcr.io/$PROJECT_ID/smart-kitchen-api'
  - 'gcr.io/$PROJECT_ID/smart-kitchen-api:$SHORT_SHA'

# Optional: Configure build timeout (default is 10 minutes)
timeout: 1200s

# Optional: Configure build triggers
# To set up automatic deployment on push to main branch:
# 1. Go to Google Cloud Console → Cloud Build → Triggers
# 2. Click "Create Trigger"
# 3. Select your GitHub repository
# 4. Set trigger to: "Push to a branch" → branch: main
# 5. Build configuration: Cloud Build configuration file (cloudbuild.yaml)
# 6. Save the trigger