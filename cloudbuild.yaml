# ============================================================
# Smart Kitchen Replenishment System — Google Cloud Build Config
# ============================================================
# This file automates deployment to Google Cloud Run
# ============================================================

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/smart-kitchen-api'
      - '-t'
      - 'gcr.io/$PROJECT_ID/smart-kitchen-api:$SHORT_SHA'
      - '.'

  # Step 2: Push both tags to Google Container Registry (the deploy step
  # below needs the $SHORT_SHA tag, not just latest)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/smart-kitchen-api'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'smart-kitchen-api'
      - '--image=gcr.io/$PROJECT_ID/smart-kitchen-api:$SHORT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8000'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=1'
      - '--max-instances=10'
      - '--set-env-vars=DATABASE_URL=postgresql+asyncpg://postgres:Chinmay2005%40@db.eqjianefzeaighbjegye.supabase.co:6543/postgres?ssl=require,SUPABASE_URL=https://eqjianefzeaighbjegye.supabase.co,SECRET_KEY=d85669c6c3e74554476c5ec4d4407ae9cba3b963e8e8d138ea59c22abdbc2e7c,SERVER_TOKEN=smart_kitchen_server_token_2024,ENABLE_SIMULATION=false,EVALUATION_INTERVAL_SECONDS=120,TELEMETRY_INTERVAL_SECONDS=60'

# Store images in Google Container Registry
images:
  - 'gcr.io/$PROJECT_ID/smart-kitchen-api'
  - 'gcr.io/$PROJECT_ID/smart-kitchen-api:$SHORT_SHA'

# Configure build timeout
timeout: 1200s

# Required when the trigger specifies a custom service account without a
# logs bucket: route build logs to Cloud Logging instead.
options:
  logging: CLOUD_LOGGING_ONLY