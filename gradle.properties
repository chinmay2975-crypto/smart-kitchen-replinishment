# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE will override
# any settings specified in this file.

# JVM memory settings - increased to prevent GC thrashing
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Disable Gradle daemon performance logging
org.gradle.daemon.performance.disable-logging=true

# Enable Gradle Daemon
org.gradle.daemon=true

# Enable parallel execution
org.gradle.parallel=true

# Disable configuration cache to avoid compatibility issues
org.gradle.configuration-cache=false

# AndroidX package structure
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Compose compiler compatibility
android.composeOptions.kotlinCompilerExtensionVersion=1.5.3