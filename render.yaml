    name: smart-kitchen-api
    runtime: docker
    repo: https://github.com/chinmay2975-crypto/smart-kitchen-replinishment
    plan: free
    region: oregon  # or singapore for Asia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
