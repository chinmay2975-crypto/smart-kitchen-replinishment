        value: postgresql+asyncpg://postgres:Chinmay2005%@db.eqjianefzeaighbjegye.supabase.co:6543/postgres?ssl=require
      - key: SUPABASE_URL
        value: https://eqjianefzeaighbjegye.supabase.co
      - key: SECRET_KEY
        value: d85669c6c3e74554476c5ec4d4407ae9cba3b963e8e8d138ea59c22abdbc2e7c
      - key: SERVER_TOKEN
        value: smart_kitchen_server_token_2024
